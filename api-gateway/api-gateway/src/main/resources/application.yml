server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth Service — PUBLIC routes (no JWT needed)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # Product Service — PROTECTED routes (JWT required)
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
          filters:
            - AuthenticationFilter
        - id: product-service-categories
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/categories/**
          filters:
            - AuthenticationFilter

        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
          filters:
            - AuthenticationFilter

      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"

jwt:
  secret: ${JWT_SECRET:shopsmart-secret-key-must-be-at-least-32-characters-long}
